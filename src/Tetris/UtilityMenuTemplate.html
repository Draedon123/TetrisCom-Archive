<template id="utilityMenu">
  <div
    id="utilityMenuContainer"
    style="
      width: 800px;
      height: 600px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      top: 0;
      z-index: 999;
    "
  >
    <div
      style="
        width: 75%;
        height: 75%;
        background-color: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
      "
    >
      <h1 id="utilityMenuTitle" style="text-align: center"></h1>
      <div id="utilities">
        <label id="keybind" for="keybindInput">
          Cheat Menu Toggle Keybind:
          <input id="keybindInput" name="keybindInput" />
          <br />
          <br />
        </label>

        <label id="restartKeybind" for="restartKeybindInput">
          Restart Game Keybind:
          <input id="restartKeybindInput" name="restartKeybindInput" />
          <br />
          <br />
        </label>

        <label id="seed" for="seedInput">
          Seed:
          <input
            type="number"
            name="seedInput"
            id="seedInput"
            placeholder="Empty = random"
          />
          <br />
          <br />
        </label>

        <label id="lockDelay" for="lockDelayInput">
          Lock Delay Override (ms):
          <input
            type="number"
            name="lockDelayInput"
            id="lockDelayInput"
            placeholder="Empty = default lock delay"
          />
          <br />
          <br />
        </label>

        <br />
        <br />
      </div>

      <div style="display: flex; align-items: center; flex-direction: column">
        <button id="closeButton">Close Menu</button>
        <div
          id="toggleCheats"
          style="display: flex; align-items: center; flex-direction: column"
        >
          <br />
          <br />
          <button id="toggleCheatsButton"></button>

          <p id="disclaimer" style="text-align: center">
            <small>Toggling cheats will reload the page</small>
            <br />
            <small>
              Disclaimer: Having cheats enabled (even if they aren't used) will
              add an asterisk to the New High Score screen and leaderboard to
              indicate that cheats were enabled. Disabling cheats will remove
              the asterisks. There is a separate scoreboard for cheated and
              non-cheated runs (enable/disable cheats to switch between them)
            </small>
          </p>
        </div>
      </div>
    </div>
  </div>
</template>
